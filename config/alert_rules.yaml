alerts:
  - name: fast_request_slo_burn
    severity: critical
    condition: 'fast_successful_requests_sli_pct < 99.5 AND request_count >= 20'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: Nguyen Minh Duc
    runbook: docs/alerts.md#alert-1
  - name: user_visible_error_rate
    severity: critical
    condition: 'request_failed / request_received * 100 > 2 AND request_count >= 20'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: Nguyen Minh Duc
    runbook: docs/alerts.md#alert-2
  - name: cost_budget_burn
    severity: warning
    condition: 'sum(cost_usd) over 24h > 2.5 USD'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#day13-alerts'
    owner: Nguyen Minh Duc
    runbook: docs/alerts.md#alert-3
